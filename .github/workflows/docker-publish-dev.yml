name: Build and Publish dev docker image

# Publication waits for the tests. workflow_run is the only link GitHub
# offers between two workflow files, and the tests live in another one, out of
# reach of a needs:. The quoted string must match the name: of .github/workflows/ci.yml
# exactly: a typo does not fail, it just never triggers, and nothing is ever
# published again. .github/check-workflow-gating.py refuses that silently-dead form.
on:
  workflow_run:
    workflows: [ "Build and Test" ]
    types: [ completed ]
    branches: [ master ]

env:
  REGISTRY_IMAGE: ghcr.io/calaos/calaos_base
  NAME: calaos_base
  IMG_TAG: dev

jobs:
  # define job to build and publish docker image
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    # types: [completed] fires on a FAILED run too, so without the conclusion
    # test the trigger would gate nothing at all. event == 'push' keeps a fork
    # pull request from reaching this job, which runs with the repository
    # secrets. The sha equality skips the run when master has already moved:
    # negz/create-tag tags github.sha, which this event resolves on the default
    # branch and not on the commit that was tested -- tagging and shipping an
    # untested commit is worse than shipping too early. The newer commit
    # publishes through its own run.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # A workflow_run run defaults to the default branch, not to the commit
          # whose tests just passed.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Calaos Action Bump Version
        id: calaos_version
        uses: calaos/action-bump-version@2
        with:
          version_fragment: 'prerelease'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Github Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.calaos_version.outputs.version_bumped }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ env.IMG_TAG }}
            ${{ env.REGISTRY_IMAGE }}:${{ steps.calaos_version.outputs.version_bumped }}

      - name: Create Tag
        uses: negz/create-tag@v1
        with:
          version: ${{ steps.calaos_version.outputs.version_bumped }}
          token: ${{ secrets.ACTION_DISPATCH }}

      - name: Build deb
        uses: peter-evans/repository-dispatch@v1
        with:
          token: ${{ secrets.ACTION_DISPATCH }}
          repository: calaos/pkgdebs
          event-type: build_deb
          client-payload: '{ "pkgname": "calaos-server", "version": "${{ steps.calaos_version.outputs.version_bumped }}", "image_src": "${{ env.REGISTRY_IMAGE }}:${{ steps.calaos_version.outputs.version_bumped }}", "prerelease": true }'

